<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Техно-Принт — Вход</title>
    <script src="/vendor/tailwind.js"></script>
    <script src="/vendor/alpine.min.js" defer></script>
    <link rel="manifest" href="/manifest.json">
    <style>
        body { font-family: 'Inter', system-ui, sans-serif; }
        .blob { position:absolute; border-radius:9999px; filter:blur(64px); opacity:.55; pointer-events:none; }
        input:focus-visible { outline:none; }
    </style>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { colors: { brand: '#2563eb' } } }
        }
    </script>
</head>
<body class="relative min-h-screen overflow-hidden bg-gradient-to-br from-slate-50 via-blue-50 to-indigo-100 dark:from-slate-950 dark:via-slate-900 dark:to-slate-800 flex items-center justify-center"
      x-data="loginApp()" x-init="init()">

    <div class="blob w-72 h-72 bg-blue-400/40 dark:bg-blue-600/25 -top-12 -left-12"></div>
    <div class="blob w-80 h-80 bg-indigo-400/30 dark:bg-indigo-700/25 -bottom-16 -right-12"></div>

    <div class="relative w-full max-w-md mx-4">
        <div class="bg-white/90 dark:bg-slate-800/90 backdrop-blur-xl rounded-2xl shadow-xl ring-1 ring-black/5 dark:ring-white/10 p-8">
            <!-- Logo -->
            <div class="text-center mb-8">
                <div class="inline-flex items-center justify-center w-16 h-16 bg-blue-600 rounded-2xl mb-4">
                    <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"/>
                    </svg>
                </div>
                <h1 class="text-2xl font-bold text-gray-900 dark:text-white">Техно-Принт</h1>
                <p class="text-gray-500 dark:text-gray-400 mt-1">Система учёта</p>
            </div>

            <!-- Form -->
            <form @submit.prevent="login()">
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Логин</label>
                        <input type="text" x-model="username" required autofocus
                               class="w-full px-4 py-3 rounded-xl border border-gray-300 dark:border-slate-600 dark:bg-slate-700 dark:text-white focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition"
                               placeholder="Введите логин">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Пароль</label>
                        <input type="password" x-model="password" required
                               class="w-full px-4 py-3 rounded-xl border border-gray-300 dark:border-slate-600 dark:bg-slate-700 dark:text-white focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition"
                               placeholder="Введите пароль">
                    </div>
                    <div class="flex items-center">
                        <input type="checkbox" x-model="remember" id="remember"
                               class="w-4 h-4 text-blue-600 rounded border-gray-300 focus:ring-blue-500">
                        <label for="remember" class="ml-2 text-sm text-gray-600 dark:text-gray-400">Запомнить меня</label>
                    </div>
                </div>

                <div x-show="error" class="mt-4 p-3 bg-red-50 dark:bg-red-900/30 text-red-600 dark:text-red-400 rounded-xl text-sm" x-text="error"></div>

                <button type="submit" :disabled="loading"
                        class="w-full mt-6 py-3 px-4 bg-blue-600 hover:bg-blue-700 disabled:bg-blue-400 text-white font-medium rounded-xl transition flex items-center justify-center gap-2">
                    <svg x-show="loading" class="animate-spin w-5 h-5" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/>
                    </svg>
                    <span x-text="loading ? 'Вход...' : 'Войти'"></span>
                </button>
            </form>
        </div>
    </div>

<script>
const API = location.origin;

function loginApp() {
    return {
        username: '',
        password: '',
        remember: true,
        loading: false,
        error: '',

        init() {
            if (localStorage.getItem('darkMode') === 'true') {
                document.documentElement.classList.add('dark');
            }
            const token = localStorage.getItem('tp_token');
            if (token) {
                location.href = '/';
            }
        },

        async login() {
            this.error = '';
            this.loading = true;
            try {
                const res = await fetch(`${API}/api/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: this.username, password: this.password })
                });
                if (!res.ok) {
                    const data = await res.json();
                    throw new Error(data.detail || 'Ошибка входа');
                }
                const data = await res.json();
                localStorage.setItem('tp_token', data.access_token);
                if (!this.remember) sessionStorage.setItem('tp_session', '1');
                location.href = '/';
            } catch (e) {
                this.error = e.message;
            } finally {
                this.loading = false;
            }
        }
    };
}
</script>
<script>
if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js').catch(() => {});
}
</script>
</body>
</html>
