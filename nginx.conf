server {
    listen 80;
    server_name tp.fixpo.ru;

    # Frontend
    location / {
        root /opt/technoprint/frontend;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # WebSocket
    location /api/ws {
        proxy_pass http://127.0.0.1:8003/api/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # REST API
    location /api/ {
        proxy_pass http://127.0.0.1:8003/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Swagger docs
    location /docs {
        proxy_pass http://127.0.0.1:8003/docs;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass http://127.0.0.1:8003/openapi.json;
        proxy_set_header Host $host;
    }

    # Health
    location /health {
        proxy_pass http://127.0.0.1:8003/health;
    }
}
